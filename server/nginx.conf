server {
    listen 80;
    server_name vc.huxa.xyz;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name vc.huxa.xyz;

    ssl_certificate /etc/letsencrypt/live/vc.huxa.xyz/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/vc.huxa.xyz/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;

    client_max_body_size 20M;
    client_body_timeout 10s;
    client_header_timeout 10s;
    keepalive_timeout 15s;

    # Tải file deb trực tiếp tốc độ cao
    location = /VCNext-custom-roothide.deb {
        alias /opt/vcnext_server/VCNext-custom-roothide.deb;
        add_header Content-Disposition 'attachment; filename="VCNext-custom-roothide.deb"';
    }

    location = /download {
        alias /opt/vcnext_server/VCNext-custom-roothide.deb;
        add_header Content-Disposition 'attachment; filename="VCNext-custom-roothide.deb"';
    }

    # Proxy các request API đến backend Python đa luồng
    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout 10s;
        proxy_send_timeout 10s;
    }
}
